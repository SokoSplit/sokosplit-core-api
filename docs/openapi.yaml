openapi: 3.0.3
info:
  title: SokoSplit Core API
  version: 0.1.0
  description: >
    Business API for SokoSplit — owns users, split-list definitions,
    transaction history, and business rules. Talks to sokosplit-wallet-service
    for on-chain state.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /split-lists:
    post:
      summary: Create a split list
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSplitListRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitList"
    get:
      summary: List split lists for the authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SplitList"
  /split-lists/{id}:
    get:
      summary: Get a split list by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SplitList"
        "404":
          description: Not found
  /split-lists/{id}/release:
    post:
      summary: Request release of an escrowed split list
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Release requested
  /webhooks/wallet-service:
    post:
      summary: Wallet service callback — updates split status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                split_id:
                  type: string
                status:
                  type: string
                  enum: [pending, escrowed, released]
      responses:
        "200":
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Recipient:
      type: object
      properties:
        address:
          type: string
        bps:
          type: integer
    CreateSplitListRequest:
      type: object
      required: [split_id, token, amount, recipients]
      properties:
        split_id:
          type: string
        token:
          type: string
        amount:
          type: integer
        recipients:
          type: array
          items:
            $ref: "#/components/schemas/Recipient"
    SplitList:
      type: object
      properties:
        id:
          type: string
          format: uuid
        split_id:
          type: string
        owner_id:
          type: string
          format: uuid
        token:
          type: string
        amount:
          type: integer
        status:
          type: string
          enum: [pending, escrowed, released]
        recipients:
          type: array
          items:
            $ref: "#/components/schemas/Recipient"
